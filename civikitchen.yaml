$schema: https://raw.githubusercontent.com/jfilter/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json
version: 1
policy:
  # Expected values for ckconform (the checker lives in the public civikitchen
  # image; these values are ours).
  license: AGPL-3.0-or-later
  copyright: 'civico GmbH'

  # herald's OWN invented hooks: other extensions implement them to contribute
  # health checks to the monitor and sections to digests. They are not core hooks,
  # so ckconform cannot know them — declared here so the dispatch is not read as a typo.
  known_hooks:
    - heraldChecks
    - heraldDigestSections

  # Floor for ckcoverage: raise as coverage grows, never lower to make a build green.
  coverage:
    minimum: 68

  # Business hooks live in scan classes (AutoSubscriber/HookInterface); the
  # classic function form is reserved for pre-boot/lifecycle/return-value hooks.
  hook_style: listener
  renovate_preset: github>civico-de/renovate
