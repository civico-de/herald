# Slow checks, off the push path: each costs a full stack boot. The upgrade
# and schema-parity jobs exercise the path every existing site takes from the
# last release tag, which a fresh install never does.
name: Compatibility

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    uses: civico-de/civikitchen/.github/workflows/extension-ci.yml@v1
    with:
      key: herald
      composer_install: true
      lifecycle: true
      upgrade_from_last_release: true
      schema_parity: true
      check_template: false
