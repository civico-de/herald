<div class="herald-admin-field" ng-repeat="field in fields" ng-if="isShown(field)" ng-switch="field.type">
  <div ng-switch-when="bool">
    <input
      type="checkbox"
      id="{{:: prefix + field.key }}"
      ng-model="inputs[field.key]"
      ng-attr-aria-describedby="{{:: field.help ? prefix + field.key + '-help' : undefined }}"
    />
    <label for="{{:: prefix + field.key }}">{{:: field.label }}</label>
  </div>
  <div ng-switch-when="enum">
    <label for="{{:: prefix + field.key }}"
      >{{:: field.label }}
      <span ng-if=":: field.required" class="crm-marker">{{:: ts('(required)') }}</span></label
    >
    <select
      id="{{:: prefix + field.key }}"
      class="crm-form-select"
      ng-model="inputs[field.key]"
      ng-options="option.value as option.label for option in field.options"
      ng-attr-aria-describedby="{{:: field.help ? prefix + field.key + '-help' : undefined }}"
    >
      <option value="">{{:: ts('(not set)') }}</option>
    </select>
  </div>
  <div ng-switch-when="object">
    <label for="{{:: prefix + field.key }}">{{:: field.label }}</label>
    <textarea
      id="{{:: prefix + field.key }}"
      class="crm-form-textarea herald-admin-code"
      rows="3"
      ng-model="inputs[field.key]"
      aria-describedby="{{:: prefix + field.key }}-help"
    ></textarea>
  </div>
  <div ng-switch-default>
    <label for="{{:: prefix + field.key }}"
      >{{:: field.label }}
      <span ng-if=":: field.required" class="crm-marker">{{:: ts('(required)') }}</span></label
    >
    <input
      type="text"
      id="{{:: prefix + field.key }}"
      class="crm-form-text"
      ng-attr-inputmode="{{:: field.type === 'int' ? 'numeric' : undefined }}"
      ng-model="inputs[field.key]"
      ng-attr-aria-describedby="{{:: field.help ? prefix + field.key + '-help' : undefined }}"
    />
  </div>
  <p class="description" id="{{:: prefix + field.key }}-help" ng-if=":: field.help || field.type === 'object'">
    {{:: field.help || ts('A JSON object of names and values.') }}
  </p>
</div>
