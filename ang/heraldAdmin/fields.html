<div class="form-group" ng-repeat="field in fields" ng-if="isShown(field)" ng-switch="field.secret && field.type !== 'object' ? 'secret' : field.tristate ? 'tristate' : field.type">
  <div ng-switch-when="secret">
    <label class="crm-af-field-label" for="{{:: prefix + field.key }}"
      >{{:: field.label }}
      <span ng-if=":: field.required" class="crm-marker" title="{{:: ts('Required') }}" aria-hidden="true">*</span></label
    >
    <div class="crm-af-field">
      <input
        type="password"
        autocomplete="new-password"
        id="{{:: prefix + field.key }}"
        class="form-control"
        ng-model="inputs[field.key]"
        ng-attr-aria-required="{{:: field.required ? 'true' : undefined }}"
        ng-attr-aria-describedby="{{:: field.help ? prefix + field.key + '-help' : undefined }}"
      />
    </div>
  </div>
  <div ng-switch-when="bool">
    <label
      class="crm-af-field-label"
      ><input
        type="checkbox"
        id="{{:: prefix + field.key }}"
        ng-model="inputs[field.key]"
        ng-attr-aria-describedby="{{:: field.help ? prefix + field.key + '-help' : undefined }}"
      />
      {{:: field.label }}</label
    >
  </div>
  <div ng-switch-when="tristate">
    <label class="crm-af-field-label" for="{{:: prefix + field.key }}">{{:: field.label }}</label>
    <div class="crm-af-field">
      <select
        id="{{:: prefix + field.key }}"
        class="form-control"
        ng-model="inputs[field.key]"
        ng-attr-aria-describedby="{{:: field.help ? prefix + field.key + '-help' : undefined }}"
      >
        <option value="">{{:: ts('- channel default -') }}</option>
        <option value="1">{{:: ts('Yes') }}</option>
        <option value="0">{{:: ts('No') }}</option>
      </select>
    </div>
  </div>
  <div ng-switch-when="enum">
    <label class="crm-af-field-label" for="{{:: prefix + field.key }}"
      >{{:: field.label }}
      <span ng-if=":: field.required" class="crm-marker" title="{{:: ts('Required') }}" aria-hidden="true">*</span></label
    >
    <div class="crm-af-field">
      <select
        id="{{:: prefix + field.key }}"
        class="form-control"
        ng-model="inputs[field.key]"
        ng-options="option.value as option.label for option in field.options"
        ng-attr-aria-required="{{:: field.required ? 'true' : undefined }}"
        ng-attr-aria-describedby="{{:: field.help ? prefix + field.key + '-help' : undefined }}"
      >
        <option value="">{{:: ts('(not set)') }}</option>
      </select>
    </div>
  </div>
  <div ng-switch-when="object">
    <label class="crm-af-field-label" for="{{:: prefix + field.key }}">{{:: field.label }}</label>
    <div class="crm-af-field">
      <textarea
        id="{{:: prefix + field.key }}"
        class="crm-form-textarea herald-admin-code"
        rows="3"
        ng-model="inputs[field.key]"
        aria-describedby="{{:: prefix + field.key }}-help"
      ></textarea>
    </div>
  </div>
  <div ng-switch-default>
    <label class="crm-af-field-label" for="{{:: prefix + field.key }}"
      >{{:: field.label }}
      <span ng-if=":: field.required" class="crm-marker" title="{{:: ts('Required') }}" aria-hidden="true">*</span></label
    >
    <div class="crm-af-field">
      <input
        type="text"
        id="{{:: prefix + field.key }}"
        class="form-control"
        ng-attr-inputmode="{{:: field.type === 'int' ? 'numeric' : undefined }}"
        ng-model="inputs[field.key]"
        ng-attr-aria-required="{{:: field.required ? 'true' : undefined }}"
        ng-attr-aria-describedby="{{:: field.help ? prefix + field.key + '-help' : undefined }}"
      />
    </div>
  </div>
  <p class="crm-af-field-help-post" id="{{:: prefix + field.key }}-help" ng-if=":: field.help || field.type === 'object'">
    {{:: field.help || ts('A JSON object of names and values.') }}
  </p>
</div>
