<af-form ctrl="afform">
  <af-entity type="HeraldDigest" name="HeraldDigest1" label="Digest" actions="{create: true, update: true}" security="RBAC" url-autofill="1" />
  <fieldset af-fieldset="HeraldDigest1" class="af-container">
    <af-field name="title" />
    <af-field name="name" defn="{help_post: 'Lowercase letters, digits and underscores. Rules and scripts pick the digest by this name.'}" />
    <af-field name="message_template_id" defn="{required: true}" />
    <fieldset class="af-container" af-title="Sources">
      <div af-join="HeraldDigestSource" actions="{update: true, delete: true}" af-repeat="Add source" class="af-container af-container-style-pane">
        <div herald-digest-source class="af-container">
          <af-field name="name" />
          <af-field name="type" />
          <div herald-digest-source-type="search" class="af-container">
            <af-field name="search_display_id" />
          </div>
          <div herald-digest-source-type="section" class="af-container">
            <af-field name="section_key" />
          </div>
          <div herald-digest-placeholders="HeraldDigest1"></div>
        </div>
      </div>
    </fieldset>
    <fieldset class="af-container" af-title="Preview">
      <div herald-digest-preview="HeraldDigest1"></div>
    </fieldset>
  </fieldset>
  <button class="af-button btn btn-primary" crm-icon="fa-check" ng-click="afform.submit()">Save</button>
</af-form>
