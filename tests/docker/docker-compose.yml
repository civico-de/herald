# civikitchen-based dev stack for herald.
#
#   cd tests/docker && docker compose up -d
#   docker compose exec app cv ext:enable herald
#   docker compose exec app bash -c "cd /var/www/html/ext/herald && phpunit"
#
# Ports are offset by +10 from civikitchen defaults so this can run alongside
# any other stack that already uses 8080/8081/1080.
#   CiviCRM:    http://localhost:8090   (admin / admin)
#   phpMyAdmin: http://localhost:8091
#   Maildev:    http://localhost:1090

name: herald-test

services:
  app:
    image: ghcr.io/jfilter/civikitchen:standalone
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      CIVICRM_AUTO_INSTALL: "1"
      CIVICRM_DB_HOST: db
      CIVICRM_DB_NAME: civicrm
      CIVICRM_DB_USER: civicrm
      CIVICRM_DB_PASSWORD: civicrm
      SITE_URL: "http://localhost:8090"
      CIVICRM_DEMO_USER: admin
      CIVICRM_SMTP_HOST: maildev
      CIVICRM_SMTP_PORT: "1025"
      # CiviRules is a hard dependency of herald — pull it on first install.
    volumes:
      # The extension repo is two levels above this compose file.
      - ../..:/var/www/html/ext/herald

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: civicrm
      MYSQL_USER: civicrm
      MYSQL_PASSWORD: civicrm
    volumes:
      - db-data:/var/lib/mysql
      # Pre-creates civicrm_test + grant — without it the headless suite
      # falls back to the live DB and leaks test settings (init scripts run
      # only on FIRST volume init; for an existing db-data volume apply the
      # SQL manually or `docker compose down -v` first).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    # Pinned like every other image here: a floating tag makes a green run
    # unreproducible and a red one unattributable.
    image: phpmyadmin/phpmyadmin:5.2.3
    depends_on:
      - db
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db

  maildev:
    # Pinned: on 2026-07-06 ':latest' moved to 3.0.0-rc.1, whose built-in
    # healthcheck queries a route its own app answers with 404 — every stack
    # using it failed to come up. 2.2.1 is the last stable release.
    image: maildev/maildev:2.2.1
    ports:
      - "1090:1080"
      - "1025"

volumes:
  db-data:
